<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fbfaf8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (function () {
        var themes = { light: 'light', 'one-dark': 'dark', nord: 'dark', macchiato: 'dark' };
        var theme;
        try {
          theme = localStorage.getItem('mintless.theme');
        } catch (e) {}
        if (!themes[theme]) {
          theme =
            window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'one-dark' : 'light';
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.mode = themes[theme];
        root.style.colorScheme = themes[theme];
      })();
    </script>
    <title>Mintless</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
